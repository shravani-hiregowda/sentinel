name: Sentinel CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://127.0.0.1:27017/sentinel_ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci_test_deterministic_jwt_secret_32_characters_minimum
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGIN: http://localhost:3000
      LOG_LEVEL: warn

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Install Backend Dependencies (Deterministic)
        run: npm --prefix backend ci

      - name: 📦 Install Frontend Dependencies (Deterministic)
        run: npm --prefix frontend ci

      - name: 🛡️ Security Audit (Backend Dependencies)
        run: npm --prefix backend audit --audit-level=critical

      - name: 🔍 Lint Backend (ESLint)
        run: npm --prefix backend run lint

      - name: 🔍 Lint Frontend (ESLint)
        run: npm --prefix frontend run lint

      - name: 🧪 Execute Backend Test Suite (99+ Tests)
        run: npm --prefix backend test

      - name: ⚡ CI Performance Smoke Test (Index & Cache Latency)
        run: npm --prefix backend run test:ci-perf

      - name: 🏗️ Verify Frontend Production Build
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: http://localhost:5000

      - name: 🚀 Verify API Server Startup & Health Endpoints
        run: |
          node backend/src/server.js &
          SERVER_PID=$!
          echo "Started API server with PID: $SERVER_PID"
          
          # Wait up to 15s for API readiness
          for i in {1..15}; do
            if curl -s http://localhost:5000/health | grep -q "ok"; then
              echo "✅ API /health is OK"
              break
            fi
            sleep 1
          done

          # Check /ready endpoint
          READY_RESPONSE=$(curl -s http://localhost:5000/ready)
          echo "Readiness response: $READY_RESPONSE"
          echo "$READY_RESPONSE" | grep -q "ready" || (echo "❌ /ready failed" && kill $SERVER_PID && exit 1)

          kill $SERVER_PID
          echo "✅ API server cleanly terminated"

      - name: 🛡️ Verify Escalation Worker Standalone Startup
        run: |
          node backend/src/workers/escalation.worker.js &
          WORKER_PID=$!
          echo "Started worker with PID: $WORKER_PID"
          sleep 4
          kill -0 $WORKER_PID || (echo "❌ Worker process terminated unexpectedly" && exit 1)
          kill $WORKER_PID
          echo "✅ Worker successfully initialized and terminated"

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: sentinel-api:${{ github.sha }}

      - name: 🐳 Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:5000
          push: false
          tags: sentinel-frontend:${{ github.sha }}
