version: '3.8'

# ==============================================================================
# Sentinel Production-Like Multi-Tenant Stack
# Services:
#   - mongodb  : Primary document store with native ping healthcheck
#   - redis    : Centralized state & BullMQ distributed queue with ping healthcheck
#   - api      : Express REST & WebSocket API with /ready healthcheck
#   - worker   : BullMQ SLA Escalation Worker (independently scalable)
#   - frontend : Nginx-hosted production React SPA
# ==============================================================================

services:
  mongodb:
    image: mongo:7.0
    container_name: sentinel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-api
    restart: unless-stopped
    command: ["node", "src/server.js"]
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/sentinel
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-production_change_me_sentinel_secret_32char_min}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=200
      - AUTH_RATE_LIMIT_MAX=20
      - LOG_LEVEL=info
      - SHUTDOWN_TIMEOUT_MS=10000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-worker
    restart: unless-stopped
    command: ["node", "src/workers/escalation.worker.js"]
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/sentinel
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-production_change_me_sentinel_secret_32char_min}
      - LOG_LEVEL=info
      - SHUTDOWN_TIMEOUT_MS=10000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongodb-data:
  redis-data:
